<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FlashCard Lite – Học từ vựng tiếng Anh hiệu quả với thuật toán Anki. Hơn 100 từ vựng theo chủ đề, tự động lên lịch ôn tập." />
    <meta name="theme-color" content="#0d0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>FlashCard Lite – Học Tiếng Anh</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />

    <!-- CSS tách theo kiến trúc Base → Layout → Components → Pages (xem css/README nếu cần,
       hoặc chú thích đầu mỗi file). Thứ tự nạp phản ánh đúng thứ tự phụ thuộc. -->
    <link rel="stylesheet" href="css/core/base.css" />
    <link rel="stylesheet" href="css/core/layout.css" />
    <link rel="stylesheet" href="css/core/components.css" />
    <link rel="stylesheet" href="css/core/utilities.css" />
    <link rel="stylesheet" href="css/features/review.css" />
    <link rel="stylesheet" href="css/features/topics.css" />
    <link rel="stylesheet" href="css/features/stats.css" />
    <link rel="stylesheet" href="css/features/study.css" />
    <link rel="stylesheet" href="css/features/settings.css" />
    <link rel="stylesheet" href="css/features/practice.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- ================================================
         REVIEW TAB
         ================================================ -->
      <section id="tab-review" class="tab-pane active" role="main" aria-label="Ôn tập">
        <div id="review-content" class="review-dashboard">
          <!-- Skeleton tĩnh hiển thị ngay khi HTML parse xong, không chờ JS/dữ liệu chủ đề tải
             (~700KB/30 file) — renderReview() sẽ ghi đè bằng nội dung thật khi sẵn sàng. -->
          <div class="skeleton-loading" aria-hidden="true">
            <div class="skeleton-block skeleton-title"></div>
            <div class="skeleton-block" style="height: 120px"></div>
            <div class="skeleton-block" style="height: 140px"></div>
            <div class="skeleton-block" style="height: 220px"></div>
          </div>
        </div>
      </section>

      <!-- ================================================
         TOPICS TAB
         ================================================ -->
      <section id="tab-topics" class="tab-pane" role="main" aria-label="Chủ đề">
        <div id="topics-content">
          <!-- Rendered by JS -->
        </div>
      </section>

      <!-- ================================================
         STATS TAB
         ================================================ -->
      <section id="tab-stats" class="tab-pane" role="main" aria-label="Thống kê">
        <div id="stats-content">
          <!-- Rendered by JS -->
        </div>
      </section>

      <!-- ================================================
         SETTINGS TAB
         ================================================ -->
      <section id="tab-settings" class="tab-pane" role="main" aria-label="Cài đặt">
        <div id="settings-content">
          <!-- Rendered by JS -->
        </div>
      </section>
    </div>
    <!-- /app-container -->

    <!-- ================================================
       BOTTOM NAVIGATION
       ================================================ -->
    <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
      <div class="sidebar-brand">
        <span class="brand-emoji">⚡</span>
        <span class="brand-text">FlashCard Lite</span>
      </div>
      <button id="nav-topics" class="tab-btn" data-tab="topics" aria-label="Chủ đề" title="Chủ đề">
        <span class="tab-icon">🗂️</span>
        <span class="tab-label">Chủ đề</span>
      </button>
      <button id="nav-review" class="tab-btn active" data-tab="review" aria-label="Ôn tập" title="Ôn tập">
        <span class="tab-icon">🔄</span>
        <span class="tab-label">Ôn tập</span>
      </button>
      <button id="nav-stats" class="tab-btn" data-tab="stats" aria-label="Thống kê" title="Thống kê">
        <span class="tab-icon">📊</span>
        <span class="tab-label">Thống kê</span>
      </button>
      <button id="nav-settings" class="tab-btn" data-tab="settings" aria-label="Cài đặt" title="Cài đặt">
        <span class="tab-icon">⚙️</span>
        <span class="tab-label">Cài đặt</span>
      </button>
    </nav>

    <!-- Thứ tự nạp bắt buộc: js/core/fsrs.js (thuật toán thuần túy) → js/core/storage.js
       (class FlashcardDB, persistence thuần) → js/core/stats-queries.js + js/core/demo-data.js
       (gắn thêm method vào FlashcardDB.prototype) → js/core/app.js (state/điều hướng/theme/toast
       + khởi động app) → js/features/*.js (logic từng tab, dùng db + app.js). Không dùng module —
       mọi hàm/biến gắn vào global scope. -->
    <script src="js/core/fsrs.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/stats-queries.js"></script>
    <script src="js/core/demo-data.js"></script>
    <script src="js/core/app.js"></script>
    <script src="js/features/review.js"></script>
    <script src="js/features/stats.js"></script>
    <script src="js/features/topics.js"></script>
    <script src="js/features/study.js"></script>
    <script src="js/features/settings.js"></script>
    <script src="js/features/practice.js"></script>
  </body>
</html>
