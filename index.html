<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="FlashCard Lite – Học từ vựng tiếng Anh hiệu quả với thuật toán Anki. Hơn 100 từ vựng theo chủ đề, tự động lên lịch ôn tập." />
  <meta name="theme-color" content="#0d0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>FlashCard Lite – Học Tiếng Anh</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Favicon emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-container">

    <!-- ================================================
         HOME TAB
         ================================================ -->
    <section id="tab-home" class="tab-pane active" role="main" aria-label="Home">
      <div id="home-content">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- ================================================
         LEARN TAB
         ================================================ -->
    <section id="tab-learn" class="tab-pane" role="main" aria-label="Learn">
      <div id="learn-content">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- ================================================
         SETTINGS TAB
         ================================================ -->
    <section id="tab-settings" class="tab-pane" role="main" aria-label="Settings">
      <div id="settings-content">
        <!-- Rendered by JS -->
      </div>
    </section>

  </div><!-- /app-container -->

  <!-- ================================================
       BOTTOM NAVIGATION
       ================================================ -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <button id="nav-home" class="tab-btn active" data-tab="home" aria-label="Home" title="Home">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">Home</span>
    </button>
    <button id="nav-learn" class="tab-btn" data-tab="learn" aria-label="Learn" title="Learn">
      <span class="tab-icon">📖</span>
      <span class="tab-label">Learn</span>
    </button>
    <button id="nav-settings" class="tab-btn" data-tab="settings" aria-label="Settings" title="Settings">
      <span class="tab-icon">⚙️</span>
      <span class="tab-label">Settings</span>
    </button>
  </nav>

  <!-- Scripts — thứ tự quan trọng: algorithm → db → views → app -->
  <script src="js/core/algorithm.js"></script>
  <script src="js/services/db.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/learn.js"></script>
  <script src="js/views/study.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
